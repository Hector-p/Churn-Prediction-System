services:
  db:
    image: postgres:15
    container_name: bank_churn_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankchurn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankchurn"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: bank_churn_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bankchurn
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build:
      context: .
    container_name: bank_churn_dashboard
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bankchurn
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: python -m streamlit run dashboard/dashboard.py --server.address 0.0.0.0 --server.port 8501
    restart: unless-stopped

  mlflow:
    build:
      context: .
    container_name: bank_churn_mlflow
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/app/mlruns
    command: >
      mlflow server
      --backend-store-uri postgresql://postgres:postgres@db:5432/bankchurn
      --default-artifact-root /app/mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_artifacts: